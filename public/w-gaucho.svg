<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="bronzeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="ponchoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>

  <g filter="url(#shadow)">
    <!-- Shadow beneath boots -->
    <ellipse cx="300" cy="850" rx="180" ry="25" fill="#000000" opacity="0.6"/>

    <!-- Boots & Spurs -->
    <path d="M 220 740 L 210 830 L 160 845 L 160 860 L 250 860 L 250 740 Z" fill="#451a03" stroke="#270e02" stroke-width="4"/>
    <path d="M 380 740 L 390 830 L 440 845 L 440 860 L 350 860 L 350 740 Z" fill="#451a03" stroke="#270e02" stroke-width="4"/>
    <!-- Spurs -->
    <circle cx="155" cy="852" r="8" fill="url(#bronzeGrad)" stroke="#fef08a" stroke-width="2"/>
    <circle cx="445" cy="852" r="8" fill="url(#bronzeGrad)" stroke="#fef08a" stroke-width="2"/>

    <!-- Bombachas Trousers -->
    <path d="M 210 520 Q 170 630 220 750 L 290 750 Q 280 620 300 530 Q 320 620 310 750 L 380 750 Q 430 630 390 520 Z" fill="#1e293b" stroke="#0f172a" stroke-width="4"/>

    <!-- Leather Belt & Boleadoras -->
    <rect x="200" y="490" width="200" height="35" rx="6" fill="#78350f" stroke="#451a03" stroke-width="3"/>
    <circle cx="250" cy="507" r="12" fill="url(#bronzeGrad)" stroke="#fef08a" stroke-width="2"/>
    <!-- Boleadoras hanging -->
    <path d="M 230 525 Q 220 570 210 590 M 240 525 Q 240 585 235 605 M 250 525 Q 260 575 265 595" stroke="#451a03" stroke-width="3" fill="none"/>
    <circle cx="210" cy="590" r="10" fill="#270e02" stroke="#78350f" stroke-width="2"/>
    <circle cx="235" cy="605" r="10" fill="#270e02" stroke="#78350f" stroke-width="2"/>
    <circle cx="265" cy="595" r="10" fill="#270e02" stroke="#78350f" stroke-width="2"/>

    <!-- Cuia de Chimarrão in Hand -->
    <path d="M 180 430 Q 165 450 180 470 Q 195 470 195 430 Z" fill="#78350f" stroke="#f59e0b" stroke-width="2"/>
    <path d="M 180 425 L 170 390" stroke="#cbd5e1" stroke-width="3"/> <!-- Bomba -->

    <!-- Broadsword / Lança Farroupilha -->
    <path d="M 410 250 L 490 700 L 475 700 L 400 250 Z" fill="url(#bladeGrad)" stroke="#f8fafc" stroke-width="2"/>
    <rect x="390" y="245" width="40" height="12" rx="3" fill="url(#bronzeGrad)"/>
    <rect x="403" y="200" width="14" height="45" fill="#451a03"/>
    <circle cx="410" cy="195" r="12" fill="url(#bronzeGrad)"/>

    <!-- Cuirass / Steel Armor -->
    <path d="M 230 320 Q 300 310 370 320 L 380 500 Q 300 520 220 500 Z" fill="#475569" stroke="#94a3b8" stroke-width="4"/>
    <path d="M 250 340 L 350 340 M 245 380 L 355 380 M 240 420 L 360 420" stroke="#334155" stroke-width="3"/>

    <!-- Red Scarf (Lenço Farroupilha) -->
    <path d="M 260 260 Q 300 310 340 260 Q 320 290 300 330 Q 280 290 260 260 Z" fill="#dc2626" stroke="#991b1b" stroke-width="2"/>

    <!-- Plaid Poncho draped over shoulder -->
    <path d="M 200 280 Q 160 380 180 550 Q 230 520 250 350 Z" fill="url(#ponchoGrad)" stroke="#f59e0b" stroke-width="3"/>
    <!-- Stripes on poncho -->
    <path d="M 180 320 L 240 310 M 175 380 L 235 370 M 175 440 L 225 430" stroke="#dc2626" stroke-width="3"/>

    <!-- Face & Beard -->
    <ellipse cx="300" cy="210" rx="38" ry="48" fill="#fbcfe8" stroke="#f43f5e" stroke-width="1"/>
    <!-- Beard & Mustache -->
    <path d="M 262 210 Q 300 270 338 210 Q 340 265 300 280 Q 260 265 262 210 Z" fill="#451a03" stroke="#270e02" stroke-width="2"/>
    <path d="M 270 215 Q 300 230 330 215 Q 300 205 270 215 Z" fill="#270e02"/>
    <!-- Eyes -->
    <circle cx="282" cy="195" r="4" fill="#0f172a"/>
    <circle cx="318" cy="195" r="4" fill="#0f172a"/>
    <!-- Eyebrows -->
    <path d="M 272 185 L 292 188 M 328 185 L 308 188" stroke="#270e02" stroke-width="4" stroke-linecap="round"/>

    <!-- Hair -->
    <path d="M 260 210 Q 250 160 300 150 Q 350 160 340 210 Q 330 140 270 150 Z" fill="#451a03"/>

    <!-- Traditional Gaucho Hat (Chapeu de Aba Larga) -->
    <ellipse cx="300" cy="155" rx="110" ry="22" fill="#1e293b" stroke="#f59e0b" stroke-width="3"/>
    <path d="M 240 155 Q 240 100 300 100 Q 360 100 360 155 Z" fill="#0f172a" stroke="#78350f" stroke-width="2"/>
    <rect x="240" y="145" width="120" height="10" fill="#dc2626"/> <!-- Red ribbon on hat -->
    <!-- Barbicacho (Hat strap) -->
    <path d="M 210 160 Q 300 250 390 160" stroke="#fef08a" stroke-width="3" fill="none"/>
  </g>
</svg>
